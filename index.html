<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      /* ── 별 배경 ── */
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i++) {
            var star = document.createElement("a-sphere");
            var r = 70, phi = Math.random() * Math.PI * 2;
            var ct = Math.random() * 2 - 1, theta = Math.acos(ct);
            star.setAttribute("position",
              (r*Math.sin(theta)*Math.cos(phi)) + " " +
              (r*Math.sin(theta)*Math.sin(phi)) + " " +
              (r*Math.cos(theta)));
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader:flat;emissive:#ffffff;emissiveIntensity:1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        }
      });

      /* ── 오빗 컨트롤 (드래그→회전, 스크롤→줌) ── */
      AFRAME.registerComponent("orbit-controls", {
        schema: {
          targetY:       { type: "number", default: 1.6 },
          minDistance:   { type: "number", default: 4   },
          maxDistance:   { type: "number", default: 28  },
          rotateSpeed:   { type: "number", default: 1.0 },
          zoomSpeed:     { type: "number", default: 0.1 },
          dampingFactor: { type: "number", default: 0.15 }
        },
        init: function () {
          this.target = new THREE.Vector3(0, this.data.targetY, 0);
          var diff = this.el.object3D.position.clone().sub(this.target);
          this.sph  = new THREE.Spherical().setFromVector3(diff);
          this.dSph = new THREE.Spherical(0, 0, 0);
          this.drag = false; this.px = 0; this.py = 0;

          this._md = this._md.bind(this); this._mm = this._mm.bind(this);
          this._mu = this._mu.bind(this); this._mw = this._mw.bind(this);
          this._ts = this._ts.bind(this); this._tm = this._tm.bind(this);
          this._te = this._te.bind(this);

          window.addEventListener("mousedown",  this._md);
          window.addEventListener("mousemove",  this._mm);
          window.addEventListener("mouseup",    this._mu);
          window.addEventListener("wheel",      this._mw, { passive: true });
          window.addEventListener("touchstart", this._ts, { passive: true });
          window.addEventListener("touchmove",  this._tm, { passive: false });
          window.addEventListener("touchend",   this._te);
        },
        _md: function (e) { this.drag=true; this.px=e.clientX; this.py=e.clientY; },
        _mm: function (e) {
          if (!this.drag) return;
          this.dSph.theta -= (e.clientX-this.px)*0.006*this.data.rotateSpeed;
          this.dSph.phi   -= (e.clientY-this.py)*0.006*this.data.rotateSpeed;
          this.px=e.clientX; this.py=e.clientY;
        },
        _mu: function () { this.drag=false; },
        _mw: function (e) {
          this.sph.radius = Math.max(this.data.minDistance,
            Math.min(this.data.maxDistance, this.sph.radius + e.deltaY*this.data.zoomSpeed));
        },
        _ts: function (e) {
          if (e.touches.length===1){ this.drag=true; this.px=e.touches[0].clientX; this.py=e.touches[0].clientY; }
        },
        _tm: function (e) {
          if (!this.drag||e.touches.length!==1) return; e.preventDefault();
          this.dSph.theta -= (e.touches[0].clientX-this.px)*0.006*this.data.rotateSpeed;
          this.dSph.phi   -= (e.touches[0].clientY-this.py)*0.006*this.data.rotateSpeed;
          this.px=e.touches[0].clientX; this.py=e.touches[0].clientY;
        },
        _te: function () { this.drag=false; },
        tick: function () {
          var d = this.data;
          this.sph.theta += this.dSph.theta;
          this.sph.phi    = Math.max(0.05, Math.min(Math.PI-0.05, this.sph.phi+this.dSph.phi));
          this.dSph.theta *= (1-d.dampingFactor*2);
          this.dSph.phi   *= (1-d.dampingFactor*2);
          var p = new THREE.Vector3().setFromSpherical(this.sph).add(this.target);
          this.el.object3D.position.copy(p);
          this.el.object3D.lookAt(this.target);
        },
        remove: function () {
          window.removeEventListener("mousedown",  this._md);
          window.removeEventListener("mousemove",  this._mm);
          window.removeEventListener("mouseup",    this._mu);
          window.removeEventListener("wheel",      this._mw);
          window.removeEventListener("touchstart", this._ts);
          window.removeEventListener("touchmove",  this._tm);
          window.removeEventListener("touchend",   this._te);
        }
      });

      /* ── 클릭 시 통통 튀기 ── */
      AFRAME.registerComponent("pop-on-click", {
        init: function () {
          this.busy = false;
          this.el.addEventListener("click", this._onClick.bind(this));
        },
        _onClick: function () {
          if (this.busy) return;
          this.busy = true;
          var el = this.el, s = el.object3D.scale, self = this;
          var bx=s.x, by=s.y, bz=s.z;
          el.setAttribute("animation__pop",  { property:"scale", from:bx+" "+by+" "+bz,
            to:(bx*1.5)+" "+(by*1.5)+" "+(bz*1.5), dur:180, easing:"easeOutQuad" });
          setTimeout(function () {
            el.setAttribute("animation__pop2", { property:"scale",
              from:(bx*1.5)+" "+(by*1.5)+" "+(bz*1.5), to:bx+" "+by+" "+bz,
              dur:450, easing:"easeOutElastic" });
            setTimeout(function () { self.busy=false; }, 450);
          }, 180);
        }
      });
    </script>
